    note: 2026-10-24 實測：單跑與 gate 上下文都 BAD=0。「flaky」已移除——它不是 suite 的性質，是閘的紅燈通道在讀整段輸出，而這支 suite 的輸出會解釋自己，其中一句提到過去某次報過 BAD=2。閘現在只讀「獨立一行的 BAD=」；詳見 W-100 與 pm/TRAPS.md T-25。
