# --------------------------------------------------------------------------- #
# invariants — 不可破壞的東西。doctor 會逐條檢查。
#
# There is ONE md5 invariant on this file:
#
#   avatar-md5      (kind: md5)     the CONTENT: the md5 of the file with
#                                   its line endings normalised to LF. A
#                                   content change is red; a line-ending-only
#                                   change is not.
#
# MEASURED 2026-10-22, all three forms of the same commit:
#   working tree        32,989 bytes  CR=0  md5=ba96b2d9727203279b8b784d256430b5
#   committed blob      32,989 bytes  CR=0  md5=ba96b2d9727203279b8b784d256430b5
#   fresh clone         32,989 bytes  CR=0  md5=ba96b2d9727203279b8b784d256430b5
#   the same content, CRLF form
#                       33,687 bytes      md5=a1eb2eb47af42e07ee048762c2592456
#
# WHY the byte-level invariant `avatar-md5-raw` WAS REMOVED on 2026-10-23.
# It is recorded here so the decision is not re-litigated from memory, and so
# nobody re-adds it thinking it was an oversight.
#
# ★★★ READ THIS BEFORE REPRODUCING ANY ARM BELOW: the arms are only
# meaningful for a stated LINE-ENDING FORM, and the form is part of the
# measurement. The earlier version of this note reported a table that had
# been produced by committing the CRLF form. The reviewer measured the same
# arms with the form this repository actually holds and the table did not
# reproduce. The note has been rewritten around the real form. ★★★
#
# THE FILE AS THIS REPOSITORY HOLDS IT (measured 2026-10-23):
#
#   bytes=32,989   CR=0   raw md5=ba96b2d9727203279b8b784d256430b5
#                           normalised md5=ba96b2d9727203279b8b784d256430b5
#
# FOUR ARMS, COMMITTING THE LF FORM -- the form the file actually has:
#
#   A  .gitattributes present + core.autocrlf=true   stored LF    content UNCHANGED
#   B  .gitattributes deleted + core.autocrlf=true   stored LF    content UNCHANGED
#   C  .gitattributes present + core.autocrlf=false  stored LF    content UNCHANGED
#   D  .gitattributes deleted + core.autocrlf=false  stored LF    content UNCHANGED
#
#   In all four arms, raw=GREEN and normalised=GREEN. There is no arm in
#   which the content changed: for the LF form the content does not change
#   under any of the four checkout rules, so there is no "real change" case
#   for a byte-level check to catch. (The reviewer is right that the earlier
#   table, which showed raw RED in A/B/C, only appears when the CRLF form is
#   committed -- and in that form the RED came from the probe having written
#   CRLF, not from the project changing anything.)
#
# WHY IT WAS REMOVED -- the reasons that actually hold:
#
#   1. IT WAS NEVER IMPLEMENTED. The doctor has no `md5-raw` branch; the
#      row fell through to "kind not checked here" and cost nothing. Since
#      D1a, an unimplemented kind is a counted problem, so a declared row
#      that the doctor cannot evaluate makes the doctor PERMANENTLY RED.
#      A declared row must be implementable, or it must not be declared.
#   2. IT IS REDUNDANT FOR THIS FILE. `avatar-md5` hashes the bytes with
#      CRLF->LF normalised, and for the LF form the raw hash and the
#      normalised hash are THE SAME VALUE. The two checks would return the
#      same verdict on this file, always. It adds no information; it does
#      not contradict anything.
#   3. ITS VERDICT WOULD DEPEND ON THE READER'S CHECKOUT, NOT ON THE
#      PROJECT. The one shape in which a raw hash is RED while the content
#      is unchanged is a CRLF working copy with normalisation off (arm D of
#      the CRLF-form table). That is a property of the machine the doctor
#      happens to run on. A guard whose answer depends on that is not a
#      guard on the project.
#
# => A byte-level invariant belongs on a container git does not rewrite.
#
# (The older note in this file said the raw hash was a1eb2eb4... in a working
# tree and ba96b2d9... in a clone, and blamed the checkout shape. That was
# measured before the checkout was pinned and no longer reproduces. A stale
# rule is worse than no rule: it sends someone to fix what is already fixed.)
#
# NOTE: this SPEC's YAML subset now SKIPS a comment INSIDE a list item, so the
# keys after it survive.  MEASURED 2026-10-24 with pm.py's own parser
# (pm.py:360-368 skips a comment line in a list, pm.py:384-395 skips one
# inside a list item): a colon-less comment inside the first `areas` item
# leaves the list at 16 rows with the item's keys intact; a comment that
# contains a colon, a comment between two items, and a comment inside a
# folded scalar body are skipped the same way.
#
# The kinds it still CANNOT carry are these two, and they are the reason the
# explanation lives here, above the list, where it is read:
#   * a comment line AT the list's own indent -- the level of the
#     `areas:` / `suites:` key -- CLOSES that list, and the items after it
#     are lost (MEASURED: 2 areas -> 1);
#   * a trailing comment on the same line as a value becomes PART OF THE
#     VALUE, because the scalar reader does not strip comments (MEASURED:
#     `criticality: high  # note` parses as the string 'high  # note').
#
# MEASURED 2026-10-24, eight comment shapes, against the parser as it is now:
#   carried:     a comment inside a list item (with or without a colon);
#                a comment between two items at the same indent;
#                a comment inside a folded scalar's body;
#                a comment one indent deeper than a key.
#   not carried: the two above.
# A comment to the LEFT of a key, at the same indent, does NOT close the list
# -- that case was measured too, and the list survived.  "AT the list's own
# indent" is the claim that holds; "at or LEFT OF" was the earlier wording
# and the LEFT OF half was never true.
# --------------------------------------------------------------------------- #
invariants:
  - id: avatar-md5
    kind: md5
    file: "MapleBench/wwwroot/js/avatar.js"
    md5: ba96b2d9727203279b8b784d256430b5
    why: 這個專案不應該碰它。變了代表有東西伸進了不該碰的檔案。
  - id: data-root-untouched
    kind: mtime-newer-than
    path: 'C:\MUWORK\GAME\MPSHS'
    mtime: '2026-10-22 08:42:00'
    exclude: ['Settings', 'Settings.*', 'screenshots', 'client-std*.log']
    why: >
      測試一律用副本。任何測試寫進這個目錄都是在改使用者的原始資料。
      2026-10-16 的 save-audit 每次都assert MPSHS 的 md5 前後一致。
      ★ `mtime:` 這個欄位是**必要的**，doctor 沒有它會報 NOT CHECKED 並計入 bad。
      它必須是「最新檔案的 mtime 或更晚」才會綠：規則是
      "newest > reference 就紅"，而 MPSHS 最新的檔案是 2026-10-22 08:41:26.786，
      所以宣告 08:42:00 讓現在的樹是綠的，而任何之後的寫入都會紅 ——
      包括發生在兩次 doctor 之間的那種，因為那些寫入的 mtime 比這個值新。
      ★ 為什麼不能用「本次 doctor 執行的開始時間」當預設：兩次執行之間被寫的檔，
      mtime 比**下一次**執行的開始時間還早，所以那個參照對它要抓的寫入永遠是綠。
      而寫入 MPSHS 的是 suite，suite 跑在閘裡、doctor 跑完之後。
      ★★ 而且它也不能當「多一層」：宣告參照是固定的過去時間點，一定比本次執行
      的開始時間**更早**，而 "newest <= 宣告參照" 必然蘊含 "newest <= 執行開始時間"
      —— 比較舊的參照只可能比較弱，不可能多抓到任何東西。
      ⇒ 所以有宣告時 doctor 只比對**宣告參照**一條，輸出裡也只有一條 reference 行；
      沒有宣告時那一列根本不量，印一條 NOT CHECKED 就結束 —— 那一列的最後一行
      就是那條 NOT CHECKED，不會再印出第二個綠色判定。
      ★★ 這個參照值是**宣告值**，不是自動值 —— 它不會自己跟著檔案走。
      如果有人**合法地**修改了 MPSHS 裡的檔案，doctor 會轉紅。
      ★★ 那是重點，不是誤報：這個 invariant 的存在意義就是「測試沒有寫進
      使用者的原始資料」，所以一次人為的合法修改轉紅，正是它應該做的事。
      要讓它回到綠，必須**刻意地**把 `mtime:` 更新到那個修改之後：
      先量 MPSHS 底下最新的 mtime（doctor 綠燈時那一行會印出
      `newest=...`），再把 `mtime:` 改成那個值或更晚的一個瞬間，
      然後重新跑 doctor 確認它綠。
      ★ 不要為了讓它綠而把 `mtime:` 往後推到「現在」—— 那等於把這道防護
      重新變成一個追不到任何寫入的擺設。
      ★★★ `exclude:` 是這道防護**唯一**的例外，而且它必須被宣告在這裡，
      理由也必須寫在這裡 —— 沒有宣告的排除就是暗門。
      2026-10-24 實測：MPSHS 不只是「原始資料」，它同時是那個遊戲客戶端的
      工作目錄，而客戶端依 src/Configuration.cpp:114-115 從**相對路徑**讀
      `Settings`，所以**活著的客戶端本來就會改寫它**（2026-10-24 12:31:05
      實測到一次改寫）。同一個目錄裡還有 98 張 beidou-client MCP harness 寫的
      截圖 PNG 與兩個 client-*.log。
      那些都不是「使用者的原始資料」—— 原始資料是那 16 個 .nx 封存。
      一道分不出「原始資料」與「程式自己的執行期檔案」的防護，會把後者當成前者
      回報，而**會亂叫的防護比沒有防護更糟**（pm/GATE.md）。
      所以排除只列「確實不是原始資料」的東西，而且被排除掉的檔案**照樣會被印出來**：
      doctor 會列出每個比參照值新的被排除檔案（相對路徑 + mtime），
      讓「有人寫了東西」這件事看得到，只是不轉紅。
      ★ 排除不放寬到封存本身：.nx、.bak、.orig 與其餘一切仍然受這道防護保護。
      ★ 2026-10-24：harness 的 screenshotDir 已改成 MPSHS 以外的絕對路徑，
      所以 `screenshots` 這條排除是為了**已經存在**的那 98 個檔案 ——
      它們是 MCP 的產出、不是原始資料，而 agent 工具的搬移/刪除被 runtime
      的工作區安全政策擋下，無法由我清掉。使用者可以自行刪除
      `MPSHS\screenshots`、`MPSHS\client-stdout.log`、`MPSHS\client-stderr.log`；
      刪掉之後這兩條排除就只剩 `Settings` 與 `Settings.*` 還有意義。
  - id: gate-has-verdict-markers
    kind: file-contains
    file: "tools/verify/gate.ps1"
    contains: ">>> RED"
    why: gate 只認顯式標記；這一條是 gate 自己可信的前提。
