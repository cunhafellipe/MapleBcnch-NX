# SPEC.yaml — MapleBench 的唯一真實來源（SPEC v2）
#
# 這份檔案回答三個問題，而這三個問題以前只能靠記性：
#   1. 這個專案有那些功能組件（areas）？哪些壞了會傷到使用者（criticality）？
#   2. 每一個判官（suite）覆蓋哪些組件？它報綠用什麼標記？它報得出紅嗎？
#   3. 哪些東西不該被破壞（invariants）？
#
# 格式刻意沿用 pm.py 的最小 YAML 子集：純量、方括號陣列、兩層縮排。
# 冷啟動的 agent 不需要 parser、schema 或相依套件就能讀它。
#
# 路由數是 2026-10-16 實測的（Api/*.cs 裡 MapGet/MapPost 的第一段路徑），
# 判官與其涵蓋面是掃 25 支 suite 腳本實際呼叫的端點前綴得出來的，不是推測。
#
# ★★★ 上面那個「25」是 2026-10-16 的數字，不是常數。它數的是「那天閘實際跑進去的
# suite」。它**不是**磁碟上的腳本檔數，也**不是**本檔 suites: 區塊現在的筆數。
# 這三件事是三個不同的母體；挑錯一個，就會把一句對的話改成另一句錯的話。
#
# 當時的證據（都在 repo 裡，隨版控一起進來）：
#   JOURNAL/2026-10-16-1935-SEG7-skill-hotkey-letter-vs-id.md:184
#     gate    RED SUITES: 0   （25 個 suite）    <- 閘自己的輸出行，不是人數的
#   JOURNAL/2026-10-16-2036-SEG8-editor-coverage-and-save-audit.md:13-18
#     234 條路由，25 個 gate suite，100% 只打 /api/simulate
#       25 suites  /api/simulate      8 suites  /api/inspect
#        3 suites  /api/files          2 suites  /api/skill-cast      1 suites  /api/node
#   JOURNAL/2026-10-16-2140-SEG9-pm-v2-system.md:18
#     234 條路由、25 個 suite……這是我手動掃出來的，工具裡沒有
# ⇒ 那次涵蓋面普查是**手動**掃描。工具從來沒有產出過「25」，所以沒有任何指令能重跑
#   出這個數 —— 它只能由上面三份紀錄佐證。這正是它必須帶著日期的理由：一個只有
#   紀錄、沒有產生器的數字，寫成常數就等於宣稱它今天還成立。
#
# ★★ 要重算，只能重算「現在」那一欄，而且必須說明數的是哪個母體。下面三個數在
#   **同一個 commit** 上就不一樣，不要混用。兩欄各有一個錨點，不要互相頂替。
#
#   ── 歷史欄：量於 commit 879a45bbc420f86af37b4941ba6ac1f5b94f8ea3（2026-10-23）
#   ★ 那個 commit 上的三個數是 **34 / 34 / 33**，已經過期（今天是 35 / 35 / 34）。
#     留著是為了標明「那天量到什麼」；2026-10-24 用同一套指令在**那個 commit 的
#     blob** 上重跑，三個數原樣重現（34 / 34 / 33），所以這欄不是傳聞。
#     ★ 下面這三條指令是**讀工作樹**的，所以今天在 repo 根跑會印出「現在欄」的
#       值；要重現 34 / 34 / 33 得 checkout 那個 commit。
#
#   (1) 本檔宣告的判官數 —— 這才是 areas: 真正對應的母體
#     python -c "import re;t=open('pm/SPEC.yaml',encoding='utf-8').read();b=t.split('\nsuites:\n',1)[1].split('\ninvariants:',1)[0];print(len(re.findall(r'^\s+- id: ',b,re.M)))"
#       34
#
#   (2) 磁碟上 tools/verify/suites/ 的腳本檔（.py/.ps1/.mjs）
#     (git ls-tree -r --name-only HEAD tools/verify/suites/ | Select-String -Pattern '\.(py|ps1|mjs)$').Count
#       34
#     這個目錄裡另有 3 個 .json（ballfighter / fighter / mobfly），不是腳本。
#
#   (3) 閘實際執行的數 —— (1) 減掉自宣告 in_gate: false 的 save-audit
#     (Select-String -Path pm/SPEC.yaml -Pattern '^\s*in_gate:\s*false').Count
#       1
#     34 - 1 = 33
#
#   ── 現在欄：量於 2026-10-24 的工作樹（**還沒進版控**，所以錨不到任何 commit；
#     HEAD 當時是 879a45bbc420f86af37b4941ba6ac1f5b94f8ea3，那個 commit 裡的
#     數字是上一欄的 34 / 34 / 33。別把這欄錨到一個還不存在的 commit。）
#     母體名稱寫在每一條前面：這三個母體各不相同，混用就會說錯話。
#
#   (1) 本檔宣告的判官數 —— 母體：declared-in-this-file
#     ★ 這才是 areas: 真正對應的母體。
#     python -X utf8 tools/pm.py doctor
#       DOCTOR_SUITES_DECLARED=35
#     （同一個數，用這支指令獨立重算，交叉核對）
#     python -c "import re;t=open('pm/SPEC.yaml',encoding='utf-8').read();b=t.split('\nsuites:\n',1)[1].split('\ninvariants:',1)[0];print(len(re.findall(r'^\s+- id: ',b,re.M)))"
#       35
#
#   (2) 磁碟上 tools/verify/suites/ 的腳本檔（.py/.ps1/.mjs）—— 母體：script-files-on-disk
#     (Get-ChildItem tools/verify/suites -File -Include *.py,*.ps1,*.mjs -Recurse).Count
#       35
#     ★ 這個目錄裡另有 3 個 .json（ballfighter / fighter / mobfly），不是腳本。
#     ★★ 歷史欄那條 git ls-tree 的指令量的是**版控裡的樹**，不是磁碟；今天它是 34，
#        少的那一支是 tools/verify/suites/empty-archive.py（還沒進版控）。
#        兩個母體今天差 1，要分清楚；寫「磁碟上」就必須用 Get-ChildItem 那條。
#        (git ls-tree -r --name-only HEAD tools/verify/suites/ | Select-String -Pattern '\.(py|ps1|mjs)$').Count
#          34
#
#   (3) 閘實際執行的數 —— 母體：executed-by-the-gate
#     ★ 這是**執行者自己的清單**（閘的 Run 行），不是宣告的減法。
#     (Select-String -Path tools/verify/gate.ps1 -Pattern "Run\s+'([^']+)'").Matches.Count
#       34
#     (Select-String -Path pm/SPEC.yaml -Pattern '^\s*in_gate:\s*false').Count
#       1
#     35 - 1 = 34
#     ★ 宣告了但閘不跑的那一個是 save-audit（自宣告 in_gate: false）。
#
# ★ (1) 和 (2) 都是 35，卻**不是同一個集合**，相同的數字不代表相同的母體：
#     宣告的 35 = tools/verify/suites/ 底下 33 支 + MapleBench/tools/ 底下 2 支
#                 （sim-skills-check.mjs、browser-verify.mjs）；
#     磁碟的 35 = tools/verify/suites/ 底下 33 支判官 + archivelib.py / archivelib.ps1
#                 （那兩個是被 harness 載入的函式庫，本身不是判官）。
#   這一格存在的理由就是：母體不明時，就算數字碰巧對了，這句話也還是錯的。

areas:
  - id: save
    title: 存檔鏈路
    criticality: high
    routes: ["/api/files/save", "/api/files/open", "/api/files/open-many", "/api/files/open-img-folder", "/api/files/create-empty"]
    note: >
      壞掉會吃掉使用者的原始資料。README 的承諾在這裡。2026-10-16 實測：
      使用者的 16 個封存全是 .nx，所以實際走的是 SaveNx，不是 README 描述的
      SaveArchive —— 後者對他們是死碼。
  - id: node
    title: 節點瀏覽與編輯
    criticality: high
    routes: ["/api/node", "/api/children", "/api/inspect", "/api/search", "/api/replace", "/api/edit", "/api/delete", "/api/clone", "/api/browse"]
    note: 編輯器每天在用的那條路。2026-10-16 起有第一個判官（node-verify, W-068）。
  - id: mapedit
    title: 地圖編輯器
    criticality: high
    routes: ["/api/maps", "/api/mapasset", "/api/minimap", "/api/batch", "/api/validate", "/api/place", "/api/create", "/api/auto-foothold", "/api/foothold-chain", "/api/set-layer-ts", "/api/undo", "/api/redo", "/api/history", "/api/changes", "/api/palette"]
    note: 這個分支相對上游的招牌功能，也是 README 拿來對標的。
  - id: simulate
    title: 模擬器
    criticality: med
    routes: ["/api/simulate", "/api/session", "/api/walk", "/api/character", "/api/step", "/api/cast", "/api/trace", "/api/geometry", "/api/advice", "/api/probe", "/api/capabilities", "/api/debug"]
  - id: skill
    title: 技能
    criticality: med
    routes: ["/api/skill", "/api/skill-cast", "/api/db"]
  - id: mob
    title: 怪物
    criticality: med
    routes: ["/api/mob", "/api/mob-sprite", "/api/mob-info", "/api/mob-attacks", "/api/mob-catalog"]
  - id: npc
    title: NPC
    criticality: med
    routes: ["/api/npc", "/api/npc-chat", "/api/npc-name"]
  - id: string
    title: 字串
    criticality: low
    routes: ["/api/string"]
  - id: items
    title: 道具與商城
    criticality: med
    routes: ["/api/items", "/api/item", "/api/icon", "/api/cashshop"]
  - id: repair
    title: 修復服務
    criticality: low
    routes: ["/api/repair"]
  - id: dump
    title: 傾出與匯出
    criticality: low
    routes: ["/api/dump", "/api/export"]
  - id: import
    title: 匯入
    criticality: med
    routes: ["/api/import"]
  - id: compose
    title: 客戶端合成
    criticality: low
    routes: ["/api/compose"]
  - id: port
    title: 移植
    criticality: low
    routes: ["/api/port"]
  - id: family
    title: 客戶端家族
    criticality: low
    routes: ["/api/family", "/api/families"]
  - id: render
    title: 繪製與預覽
    criticality: low
    routes: ["/api/canvas", "/api/thumb", "/api/preview", "/api/raw", "/api/audio", "/api/scan", "/api/look", "/api/animation", "/api/portal-icons"]

# --------------------------------------------------------------------------- #
# 判官註冊表。gate.ps1 消費這份表，不再維護一份手寫清單。
#
# asserts=false 的 suite 不能報紅，那正是 W-057 存在的理由；
# one_shot=true 的 suite 每個伺服器只能跑一次（2026-10-16 實測：
# save-audit 固定路徑第一次綠、第二到四次全在複製那一步 Errno 22）。
# --------------------------------------------------------------------------- #
suites:
  - id: ladder-all
    file: tools/verify/suites/ladder-all.ps1
    runner: powershell
    verdict: "ALL LADDERS PASS"
    red_marker: [">>> RED"]
    asserts: true
    areas: [simulate]
  - id: attack-test
    file: tools/verify/suites/attack-test.ps1
    runner: powershell
    verdict: "VERDICT:"
    red_marker: [">>> RED", "NO damage number"]
    asserts: true
    areas: [simulate]
  - id: skill-test
    file: tools/verify/suites/skill-test.ps1
    runner: powershell
    verdict: "VERDICT: skill-test"
    red_marker: [">>> RED"]
    asserts: true
    areas: [simulate, skill]
  - id: mob-attack-verify
    file: tools/verify/suites/mob-attack-verify.ps1
    runner: powershell
    verdict: "VERDICT: mob-attack-verify"
    red_marker: [">>> RED"]
    asserts: true
    areas: [simulate, mob]
  - id: first-attack-verify
    file: tools/verify/suites/first-attack-verify.ps1
    runner: powershell
    verdict: "PASS:"
    red_marker: [">>> RED"]
    asserts: true
    areas: [simulate, mob]
    note: 2026-10-24 實測：單跑 3 次有 1 次紅（閘內 14:54 也紅）。紅的不是樹——沒有 firstAttack 的 2220100 會沿 foothold 巡邏（實測 400 幀 x 1666→2068、1662→1501，一次還從玩家身上走過，距離 0.1px），而 stage 1 斷言禁止「任何移動」且宣稱「朝玩家」卻從不檢查方向；召喚點又是隨機的（100px 內）。**「flaky」已移除**：斷言改成量「沒有追逐」，三個合取——gapN ≤ 40px ∧ tailMax ≤ 40px ∧ closureFrac ≥ 0.10。離線套在 9 筆記錄上：6 筆 plain 全部 False、3 筆 firstAttack 全部 True，零重疊；單跑 10 次 exit 0，裁決字串只有一種（`PASS: it did not pursue -- no firstAttack, never struck`）。修法與理由見 W-103。
  - id: npc-label-check
    file: tools/verify/suites/npc-label-check.ps1
    runner: powershell
    verdict: "VERDICT: npc-label-check"
    red_marker: [">>> RED"]
    asserts: true
    areas: [npc, string]
    added: W-069
    note: >
      W-069 修好了。原本 28 行全是 Invoke-RestMethod 與 Write-Host，零比較零 throw，
      gate 因此對一個不可能失敗的 suite 顯示 ok。還有第三種更安靜的失敗：迴圈在第一個
      有 NPC 的區域 break、沒有的 continue，所以「整張圖都沒有 NPC」時它什麼都沒驗
      就通過。現在那個情況會大聲報紅。
  - id: sim-skills-check
    file: MapleBench/tools/sim-skills-check.mjs
    runner: node
    verdict: "passed,"
    red_marker: [">>> RED"]
    asserts: true
    areas: [simulate, skill]
  - id: npc-chat
