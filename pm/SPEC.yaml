    red_marker: [">>> RED"]
    asserts: true
    areas: [simulate, mob]
    added: ADR-0005-2
    note: >
      ADR-0005 第二條驗收標準「機制準確」的第一支判官，攻擊幀的時序。
      參照規則抄進程式碼並標來源行號（Animation.cpp:64-67 的 100 ms fallback、
      Animation.cpp:177-193 的幀集合、Mob.cpp:151-153 的 duration 與 attackAfter、
      Mob.cpp:48-57 的 info/link 借圖），封存的數值從 archive 端讀，port 讀錯節點
      就不能靠同意自己過關。斷言：槽位集合、duration、命中時刻、投射物自己的幀延遲，
      加上兩組寫下來的已知答案。覆蓋面是全體：2,100 張 mob img、1,677 個 attack 節點、
      參照承認的 2,023 個槽位，沒有抽樣。
  - id: attack-damage
    file: tools/verify/suites/attack-damage.py
    runner: python
    verdict: "VERDICT: attack-damage"
    red_marker: [">>> RED"]
    asserts: true
    areas: [simulate, mob]
    added: ADR-0005-2
    note: >
      ADR-0005 第二條「機制準確」的第二支判官，攻擊的傷害數字與投射物速度。
      抄進程式碼的參照規則：Mob.cpp:160（power = 攻擊自己的 MADamage/PADamage，
      沒有就退回 Mob.cpp:60-61 怪物自己的 info/MADamage|PADamage；三元條件是節點
      「存在」而非值為真，node.cpp:152-154）、Mob.cpp:161（bullet_speed =
      max(1, bulletSpeed)，預設 100）、node.cpp:227-229（get_bool 只有整數節點
      為真）、Mob.cpp:169（geometry type）、node.cpp:155-173（字串以 stoll 解析，
      所以 "900" 是 900）、MobAttack.cpp:157（投射物飛行時間 = 半徑×600/速度）。
      封存的數值從 archive 端連同節點「型別」一起讀（/api/inspect），因為參照的規則
